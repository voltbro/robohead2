/**:
  ros__parameters:
    grammar_timeout: 5.0
    default_mode: 0
    # 0 off recognition
    # 1 key words recognition
    # 2 commands recognition
    # 3 free recognition
    sample_rate: 16000
    model_path: '/home/pi/robohead_ws/src/robohead2/speech_recognizer/config/vosk-model-small-ru-0.22'
    wake_phrases:
      - "слушай робот"

    commands:
      - 'покажи уши'
      - 'поздоровайся'
      - 'следи за шариком'
      - 'сделай фото'
      - 'покажи левое ухо'
      - 'покажи правое ухо'

    ros:
      service_name:
        set_mode: '~/set_mode'
      topic_name:
        wake_phrases: '~/wake_phrases'
        commands: '~/commands'
        audio_input: '/robohead_controller/respeaker_driver/audio/main'

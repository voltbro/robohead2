<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Панель управления Робоголовой</title>
  <!-- <link rel="stylesheet" href="/styles.css"> -->
  <link rel="stylesheet" href="/styles.css?v=1.0.5">
</head>

<body>
  <header>
    <div>
      <h1>Робоголова 2.0</h1>
      <p id="connection">Подключение...</p>
    </div>
    <div class="status"><span id="battery">Батарея: --</span><span id="doa">DoA: --</span></div>
  </header>
  <main>

    <section class="panel camera-panel">
      <div class="panel-title">Камера</div>
      <img id="camera" src="/camera.mjpg" alt="camera stream">
      <div class="row camera-tools"><button id="listenAudio">Прослушать</button></div>
    </section>

    <section class="panel controls neck-panel">
      <div class="panel-title">Шея</div>
      <div id="joystick" class="joystick">
        <div id="stick" class="stick"></div>
      </div>
      <div class="readout"><span id="neckReadout">V 0 | H 0</span></div>
    </section>

    <section class="panel controls">
      <div class="panel-title">Уши</div>
      <label>Лево <input id="earL" type="range" min="-90" max="90" value="0" value="0" orient="vertical"></label>
      <label>Право <input id="earR" type="range" min="-90" max="90" value="0" value="0" orient="vertical"></label>
      <div class="row"><button data-ears="0,0">Центр</button><button data-ears="90,-90">Wave</button></div>
    </section>

    <section class="panel tts">
      <div class="panel-title">Речь</div><textarea id="ttsText" rows="3" placeholder="Text to speak"></textarea>
      <div class="row"><select id="voice">
          <option>eugene</option>
          <option>xenia</option>
          <option>aidar</option>
          <option>baya</option>
          <option>kseniya</option>
        </select><button id="speak">Речь</button></div><label>Громкость <input id="volume" type="range" min="0"
          max="100" value="60"></label>
    </section>
    <section class="panel led">
      <div class="panel-title">ReSpeaker LED</div>
      <div class="row"><input id="ledColor" type="color" value="#24d18b"><button id="setLed">Set</button></div>
      <label>Яркость <input id="brightness" type="range" min="0" max="100" value="80"></label>
      <div class="row modes"><button data-mode="0">0</button><button data-mode="1">1</button><button
          data-mode="2">2</button><button data-mode="3">3</button><button data-mode="4">4</button><button
          data-mode="5">5</button></div>
    </section>

    <section class="panel media">
      <div class="panel-title">Медиа</div>

      <!-- Пути для ручного ввода (как было) -->
      <input id="videoPath" placeholder="video path">
      <input id="audioPath" placeholder="audio path">

      <!-- Загрузка файла -->
      <div class="row" style="margin-top:8px">
        <input id="mediaUpload" type="file" accept="video/*,image/*,audio/*" style="flex:1">
        <button id="uploadMedia">Загрузить</button>
      </div>
      <div id="uploadProgress" style="font-size:12px;color:#888;margin:4px 0"></div>

      <!-- Опции -->
      <label style="display:flex;align-items:center;gap:6px;margin:8px 0">
        <input id="mediaLoop" type="checkbox">
        <span>Зацикливание</span>
      </label>

      <!-- Кнопки управления -->
      <div class="row">
        <button id="playMedia">Старт</button>
        <button id="stopMedia">Стоп</button>
      </div>

      <button id="localCameraBtn">📷 Камера устройства</button>
    </section>

    <section class="panel draw-panel">
      <div class="panel-title">Рисовашка на дисплее</div>
      <canvas id="paint" width="1080" height="1080"></canvas>
      <div class="row tools">
        <label>Цвет кисти <input id="paintColor" type="color" value="#6ee7b7"></label>
        <label>Цвет фона <input id="background" type="color" value="#101214"></label>
        <label class="brush-label">Толщина кисти<input id="brush" type="range" min="3" max="60" value="14"></label>
        <button id="clearPaint">Очистить</button>
      </div>
    </section>

  </main>
  <script src="/app.js"></script>
</body>

</html>

<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Панель управления Робоголовой</title>
  <link rel="stylesheet" href="/styles.css?v=1.0.11">
</head>

<body>
  <header>
    <div>
      <h1>Робоголова 2.0</h1>
      <p id="connection">Подключение...</p>
    </div>
    <div class="header-status"><span id="battery">Батарея: --</span><span id="doa">DoA: --</span></div>
  </header>
  <main>

    <section class="panel panel-camera">
      <div class="panel-title">Камера</div>
      <img id="camera" src="/camera.mjpg" alt="camera stream">
      <div class="panel-row camera-panel-tools"><button id="listenAudio">Прослушать</button></div>
    </section>

    <section class="panel panel-controls panel-neck">
      <div class="panel-title">Шея</div>
      <div id="joystick" class="joystick">
        <div id="stick" class="stick"></div>
      </div>
      <div class="readout"><span id="neckReadout">V 0 | H 0</span></div>
      <button id="circleToggle">Круг</button>
    </section>

    <section class="panel panel-controls">
      <div class="panel-title">Уши</div>
      <div class="ear-controls">

        <label class="ear-control">
          <span>Лево</span>
          <input id="earL" type="range" min="-90" max="90" value="0"
            class="ear-range">
        </label>

        <label class="ear-control">
          <span>Право</span>
          <input id="earR" type="range" min="-90" max="90" value="0"
            class="ear-range">
        </label>

      </div>

      <div class="panel-row"><button data-ears="0,0">Центр</button><button data-ears="-90,-90">Назад</button>
        <button data-ears="90,90">Вперед</button><button id="waveToggle">Волна</button>
      </div>
    </section>

    <section class="panel panel-tts">
      <div class="panel-title">Речь (TTS)</div><textarea id="ttsText" rows="3" placeholder="Text to speak"></textarea>
      <div class="panel-row"><select id="voice">
          <option>eugene</option>
          <option>xenia</option>
          <option>aidar</option>
          <option>baya</option>
          <option>kseniya</option>
        </select><button id="speak">Озвучить</button></div><label>Громкость <input id="volume" type="range" min="0"
          max="100" value="60"></label>
    </section>
    <section class="panel panel-led">
      <div class="panel-title">ReSpeaker LED</div>
      <div class="panel-row"><input id="ledColor" type="color" value="#24d18b"><button id="setLed">Set</button></div>
      <label>Яркость <input id="brightness" type="range" min="0" max="100" value="80"></label>
      <label>Режимы работы</label>
      <div class="panel-row panel-modes"><button data-mode="0">0</button><button data-mode="1">1</button><button
          data-mode="2">2</button><button data-mode="3">3</button><button data-mode="4">4</button><button
          data-mode="5">5</button></div>
    </section>

    <section class="panel panel-media">
      <div class="panel-title">Медиа</div>

      <!-- Пути для ручного ввода (как было) -->
      <input id="videoPath" placeholder="video path">
      <input id="audioPath" placeholder="audio path">

      <!-- Загрузка файла -->
      <!-- Загрузка файла -->
      <div class="media-upload-row">
        <!-- flex: 1 заставляет инпут растягиваться, заполняя строку -->
        <input id="mediaUpload" type="file"
          accept="video/*,image/*,audio/*,.mp3,.wav,.m4a,audio/mpeg,audio/mp3,audio/wav" class="media-upload-input">
        <button id="uploadMedia">Загрузить</button>
      </div>
      <div id="uploadProgress"></div>



      <!-- Опции -->


      <!-- Кнопки управления -->
      <div class="panel-row">
        <button id="playMedia">Старт</button>
        <button id="stopMedia">Стоп</button>

        <label class="media-loop-label">
          <input id="mediaLoop" type="checkbox">
          <span>Зацикливание</span>
        </label>
      </div>

      <div class="panel-row">
        <button id="localCameraBtn">📷 Камера</button>
        <button id="voiceStreamBtn">🎤 Микрофон</button>
      </div>

    </section>

    <section class="panel panel-draw">
      <div class="panel-title">Рисовашка на дисплее</div>
      <canvas id="paint" width="1080" height="1080"></canvas>
      <div class="panel-row panel-tools">
        <label>Цвет кисти <input id="brushColor" type="color" value="#6ee7b7"></label>
        <label>Цвет фона <input id="backgroundColor" type="color" value="#101214"></label>
        <label class="brush-size-label">Толщина кисти<input id="brushThickness" type="range" min="3" max="60"
            value="14"></label>
        <button id="clearPaint">Очистить</button>
      </div>
    </section>

  </main>
  <script src="/utils.js"></script>
  <script src="/ws.js"></script>
  <script src="/draw-panel.js"></script>
  <script src="/neck-panel.js"></script>
  <script src="/ears-panel.js"></script>
  <script src="/tts-panel.js"></script>
  <script src="/led-panel.js"></script>
  <script src="/media-panel.js"></script>
  <script src="/audio-panel.js"></script>
  <script src="/camera-panel.js"></script>
  <script src="/voice-panel.js"></script>
  <!-- <script src="/app.js"></script> -->
  <script src="/app.js?v=1.0.152"></script>
</body>

</html>
